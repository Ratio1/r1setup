---
- name: Resolve runtime metadata values
  ansible.builtin.set_fact:
    r1setup_cli_version_effective: "{{ r1setup_cli_version | default('unknown', true) }}"
    r1setup_collection_version_effective: >-
      {{
        r1setup_collection_version
        | default(
            (
              (
                lookup('ansible.builtin.file', playbook_dir ~ '/../galaxy.yml', errors='ignore')
                | default('{}', true)
              )
              | from_yaml
            ).version,
            true
          )
        | default('unknown', true)
      }}
    r1setup_last_applied_action_effective: "{{ r1setup_last_applied_action | default('deploy', true) }}"

- name: Create r1setup metadata directory
  ansible.builtin.file:
    path: "{{ mnl_r1setup_metadata_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render r1setup metadata file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/setup/templates/r1setup-metadata.json.j2"
    dest: "{{ mnl_r1setup_metadata_host_path }}"
    owner: root
    group: root
    mode: '0644'
    force: true

# Fetch the rendered metadata file back to the controller so the CLI can
# read per-host variant / driver_owner / image_url reliably (rather than
# parsing Ansible stdout, which varies by callback plugin).
- name: Fetch r1setup metadata for CLI report
  ansible.builtin.fetch:
    src: "{{ mnl_r1setup_metadata_host_path }}"
    dest: "{{ r1setup_fetched_metadata_dir | default('/tmp/r1setup-fetched') }}/{{ inventory_hostname }}.json"
    flat: true

- name: Create helper registry directory
  ansible.builtin.file:
    path: "{{ r1setup_helper_registry_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render helper registry entry
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/setup/templates/r1service-instance.env.j2"
    dest: "{{ r1setup_helper_registry_path }}"
    owner: root
    group: root
    mode: '0644'
    force: true

- name: Create service for {{ mnl_app_name }}
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/setup/templates/edge_node.service.j2"
    dest: /etc/systemd/system/{{ edge_node_service_name }}.service
    mode: '0644'
    force: true

# needrestart restarts every unit whose processes map a host library that a package
# upgrade replaced. For the node unit that is only the docker client: the node runs
# on the libraries of its image, so the restart patches nothing and stops the node.
# A host without needrestart has no snippet folder and needs no deferral.
- name: Check for needrestart
  ansible.builtin.stat:
    path: /etc/needrestart/conf.d
  register: r1setup_needrestart_conf_dir

# One file per service, so several instances on one machine do not overwrite each
# other. The file is compiled with Perl before it is installed, because needrestart
# stops with an error on a snippet that is not valid Perl.
- name: Defer needrestart restarts of {{ edge_node_service_name }}
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/setup/templates/needrestart-edge-node.conf.j2"
    dest: "/etc/needrestart/conf.d/50-r1setup-{{ edge_node_service_name }}.conf"
    owner: root
    group: root
    mode: '0644'
    validate: perl -c %s
  when: r1setup_needrestart_conf_dir.stat.exists
